<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验室 | 个人作品集</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f4f7f6; color: #333; }
        header { background: var(--primary-color); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: block; text-align: center; background: var(--accent-color); color: white; padding: 10px; border-radius: 5px; text-decoration: none; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>物理教师：[你的名字] 的互动教学空间</h1>
        <p>探索物理规律，直观体验科学奥秘</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>作品 1：牛顿第二定律模拟</h3>
            <p>演示力、质量与加速度的关系。点击下方链接查看交互演示。</p>
            <a href="projects/newton.html" class="btn">查看作品</a>
        </div>
        
        <div class="card">
            <h3>作品 2：光学透镜成像实验</h3>
            <p>动态调整焦距，观察成像变化。</p>
            <a href="projects/optics.html" class="btn">查看作品</a>
        </div>
    </div>
</body>
</html>
